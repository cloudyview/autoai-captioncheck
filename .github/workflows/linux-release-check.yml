name: Linux verification of v1.1.3 release

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the published ZIP against Linux filename limits
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, platform, subprocess, tempfile, urllib.request, zipfile
          from pathlib import Path

          assert platform.system() == 'Linux'
          archive_url = 'https://github.com/cloudyview/autoai-captioncheck/releases/download/v1.1.3/captioncheck-v1.1.3.zip'
          archive_sha = 'a958e87d117e26f0a76eefe9952572ead773363811adc6574450cc90f9d54ac1'
          baseline_commit = 'f6ca3e5a76931be2f72d409809ba35fb649e2eae'
          baseline_url = f'https://raw.githubusercontent.com/cloudyview/autoai-captioncheck/{baseline_commit}/cli.cjs'
          def fetch(url):
              with urllib.request.urlopen(url, timeout=30) as response:
                  return response.read()

          archive = fetch(archive_url)
          assert hashlib.sha256(archive).hexdigest() == archive_sha, 'Release ZIP checksum mismatch'
          with tempfile.TemporaryDirectory(prefix='captioncheck-linux-release-') as directory:
              root = Path(directory)
              tool = root / 'tool'
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  bundle.extractall(tool)
              baseline = tool / 'baseline-cli.cjs'
              baseline.write_bytes(fetch(baseline_url))
              name = '测' * 83 + '.srt'
              source = root / name
              text = '1\n00:00:00,000 --> 00:00:03,000\n六个字的长句\n'
              source.write_text(text, encoding='utf-8')
              original_sha = hashlib.sha256(source.read_bytes()).hexdigest()
              name_max = os.pathconf(root, 'PC_NAME_MAX')
              assert len(name.encode('utf-8')) == 253
              old = subprocess.run(['node', str(baseline), str(source), '--out', str(root / 'baseline-output')], capture_output=True, text=True, timeout=30)
              assert old.returncode != 0 and 'ENAMETOOLONG' in old.stderr, 'Expected baseline Linux filesystem failure was not observed'
              output = root / 'release-output'
              current = subprocess.run(['node', str(tool / 'cli.cjs'), str(source), '--out', str(output)], capture_output=True, text=True, timeout=30)
              assert current.returncode == 0, current.stderr
              files = list(output.iterdir())
              assert len(files) == 4, 'Expected four delivered outputs'
              byte_lengths = [len(file.name.encode('utf-8')) for file in files]
              assert max(byte_lengths) <= name_max
              assert all('\ufffd' not in file.name for file in files)
              normalized = next(file for file in files if file.name.endswith('.normalized.srt'))
              assert normalized.read_text(encoding='utf-8').strip() == text.strip()
              assert hashlib.sha256(source.read_bytes()).hexdigest() == original_sha
              result = {
                  'release': 'v1.1.3', 'archive_sha256': archive_sha,
                  'os': platform.platform(), 'node': subprocess.check_output(['node', '--version'], text=True).strip(),
                  'filesystem_name_max_bytes': name_max, 'input_name_bytes': 253,
                  'baseline_source_commit': baseline_commit, 'baseline_exit': old.returncode,
                  'baseline_error': 'ENAMETOOLONG', 'release_exit': current.returncode,
                  'output_files': len(files), 'max_output_name_bytes': max(byte_lengths),
                  'input_unchanged': True, 'normalized_text_and_times_unchanged': True
              }
              print(json.dumps(result, ensure_ascii=False, sort_keys=True))
              Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('```json\n' + json.dumps(result, ensure_ascii=False, indent=2) + '\n```\n', encoding='utf-8')
          PY
